server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
